<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Entre na sua conta da Central-Livro.">

    <link rel="shortcut icon" href="img/logo1.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/style.css">

    <title>Login | Central-Livro</title>
</head>

<body class="pagina-autenticacao">

    <main class="auth-main">

        <section class="auth-card" aria-labelledby="titulo-login">

            <h1 class="auth-marca" id="titulo-login">
                Central-Livro
            </h1>

            <p class="auth-descricao">
                Acesse sua conta para continuar sua jornada literária.
            </p>

            <form class="auth-form" action="index.html" method="get">

                <fieldset>

                    <legend>Entrar na minha conta</legend>

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        name="senha"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <div class="auth-opcoes">

                        <label class="auth-checkbox" for="lembrar-login">

                            <input
                                type="checkbox"
                                name="lembrar"
                                id="lembrar-login"
                                value="sim"
                            >

                            Lembrar meus dados

                        </label>

                        <a class="auth-link" href="#">
                            Esqueci minha senha
                        </a>

                    </div>
                    
                    <button class="auth-botao" type="submit">
                        Entrar
                    </button>

                </fieldset>

            </form>

            <p class="auth-rodape">
                Ainda não tem uma conta?

                <a class="auth-link" href="cadastro.html">
                    Cadastre-se
                </a>
            </p>

        </section>

    </main>

</body>
</html>
